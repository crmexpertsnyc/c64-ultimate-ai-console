[project]
name = "c64-ai-console"
version = "0.5.0"
description = "AI-assisted remote console for the Commodore 64 Ultimate, built on the documented Ultimate REST API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "segno>=1.6",
    "truststore>=0.9",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM105", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/ai/parser.py" = ["E501"]
